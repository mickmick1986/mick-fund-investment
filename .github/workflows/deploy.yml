name: 部署金字塔丛林补仓指导图

on:
  push:
    branches: [main]
    paths:
      - 'deploy/index.html'
      # 用 PAT 推送时，每帧快照提交也会直接触发本工作流。
      # 注意：云端 publish_live_snapshot.py 用的是 github.token（GITHUB_TOKEN），
      # GitHub 会抑制该 token 产生的 push 事件，所以真正生效的是下面的 workflow_run。
      - 'deploy/live_estimates.json'
      - '.github/workflows/deploy.yml'
  # 2026-11-24 新增：每帧实时快照跑完后重建站点。
  # 触发源是"运行完成"事件，不受 GITHUB_TOKEN 抑制规则影响，也无需配置 PAT。
  # 频率约 6 次/小时（交易时段每 10 分钟一帧），在 Pages 部署限额内。
  workflow_run:
    workflows: ["更新盘中基金估值"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # 实时工作流失败时不必重建（页面数据没变化），也避免无意义的部署记录。
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          # workflow_run 触发时，取触发那次运行的提交（即刚写入最新快照的提交）
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传静态站点
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

      - name: 部署到 GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      # 2026-11-24 事故：artifact 已上传成功（36KB, ID 14883722695），但 deploy-pages 紧接着
      # 查到 "Found 0 artifact(s)" 直接失败，属 GitHub 侧产物元数据索引抖动（当日首次出现，
      # 手动重跑第二次即成功）。下面两步自动重试，避免整站一整天停在旧版本。
      - name: 等待 GitHub 产物索引同步
        if: steps.deployment.outcome != 'success'
        run: |
          echo "首次部署未成功（${{ steps.deployment.outcome }}），等待 20 秒后重试"
          sleep 20

      - name: 部署重试
        id: deployment_retry
        if: steps.deployment.outcome != 'success'
        uses: actions/deploy-pages@v4

      - name: 汇总部署结果
        if: always()
        run: |
          echo "首次部署: ${{ steps.deployment.outcome }}"
          echo "重试部署: ${{ steps.deployment_retry.outcome }}"
          if [ "${{ steps.deployment.outcome }}" != "success" ] && [ "${{ steps.deployment_retry.outcome }}" != "success" ]; then
            echo "::error::两次部署均失败，页面仍停留在旧版本，请手动重新运行本工作流"
            exit 1
          fi
