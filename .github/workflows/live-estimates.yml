name: 更新盘中基金估值

on:
  schedule:
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 1-3 * * 1-5'
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 5-6 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# 实时快照由本工作流直接部署到 Pages，避免内置令牌提交无法触发另一条部署工作流的问题。
concurrency:
  group: live-estimates
  cancel-in-progress: false

jobs:
  publish-live-estimates:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install requests

      - name: 判断中国交易时段
        id: market
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo("Asia/Shanghai"))
          minutes = now.hour * 60 + now.minute
          active = now.weekday() < 5 and 570 <= minutes <= 900
          print(f"active={'true' if active else 'false'}")
          PY

      - name: 抓取并写入实时估值快照
        if: steps.market.outputs.active == 'true'
        run: python fetch_live_estimates.py

      - name: 提交实时估值快照
        if: steps.market.outputs.active == 'true'
        run: |
          if git diff --quiet -- deploy/live_estimates.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/live_estimates.json
          git commit -m "chore: 更新盘中基金估值"
          git push

      - name: 配置 Pages
        if: steps.market.outputs.active == 'true'
        uses: actions/configure-pages@v5

      - name: 上传实时页面工件
        if: steps.market.outputs.active == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

      - name: 部署实时快照到 Pages
        if: steps.market.outputs.active == 'true'
        uses: actions/deploy-pages@v4
