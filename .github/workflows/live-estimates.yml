name: 更新盘中基金估值

# 主时钟策略（2026-10-19 定稿）：本地 WorkBuddy 分时任务为主，GitHub cron 为云端兜底。
# 背景：Actions 此前全部由本地 workflow_dispatch 派发，本地客户端停摆时公开页断更
#（10-19 早盘 09:30-10:40 零提交实证）。加 schedule 后本地停摆时云端自跑同一条
# fetch+校验+发布链。cron 常有 3-15 分钟延迟，仅作兜底；双跑冲突由 concurrency
# 排队 + Contents API 乐观 SHA 自然化解（一方失败无害，下一轮自愈）。
# 非交易时段由下方 active 门闸自动跳过，不会产生发布。
on:
  workflow_dispatch:
  schedule:
    # A 股交易时段：北京 09:30-11:30 / 13:00-15:00 = UTC 01:30-03:30 / 05:00-07:00
    - cron: '30-59/10 1 * * 1-5'   # UTC 01:30-01:50 = 北京 09:30-09:50
    - cron: '*/10 2-3 * * 1-5'     # UTC 02:00-03:50 = 北京 10:00-11:50
    - cron: '*/10 5-6 * * 1-5'     # UTC 05:00-06:50 = 北京 13:00-14:50
    - cron: '0 7 * * 1-5'          # UTC 07:00      = 北京 15:00 收尾帧

permissions:
  contents: write

concurrency:
  group: live-estimates
  cancel-in-progress: false

jobs:
  publish-live-estimates:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: python -m pip install requests

      - name: 判断中国交易时段
        id: market
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo("Asia/Shanghai"))
          minutes = now.hour * 60 + now.minute
          active = now.weekday() < 5 and (570 <= minutes <= 690 or 780 <= minutes <= 900)
          print(f"active={'true' if active else 'false'}")
          PY

      - name: 抓取实时估值到唯一快照文件
        if: steps.market.outputs.active == 'true'
        run: python fetch_live_estimates.py

      - name: 校验实时快照完整性与路径
        if: steps.market.outputs.active == 'true'
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo

          allowed = {Path("deploy/live_estimates.json")}
          changed = set()
          import subprocess
          for line in subprocess.check_output(["git", "status", "--porcelain"], text=True).splitlines():
              path = line[3:].strip()
              if path:
                  changed.add(Path(path))
          assert changed <= allowed, f"unexpected changed paths: {sorted(map(str, changed))}"
          path = Path("deploy/live_estimates.json")
          with path.open(encoding="utf-8") as f:
              snapshot = json.load(f)
          today = datetime.now(ZoneInfo("Asia/Shanghai")).date().isoformat()
          assert snapshot.get("trade_date") == today, snapshot.get("trade_date")
          updated_at = datetime.strptime(snapshot["updated_at"], "%Y-%m-%d %H:%M:%S")
          assert updated_at.date().isoformat() == today
          now = datetime.now(ZoneInfo("Asia/Shanghai")).replace(tzinfo=None)
          age = now - updated_at
          assert timedelta(0) <= age <= timedelta(minutes=20), f"stale snapshot age={age}"
          assert snapshot.get("estimate_count") == 25
          assert len(snapshot.get("estimates", {})) == 25
          turnover = (snapshot.get("sse_index") or {}).get("market_turnover_trillion")
          assert isinstance(turnover, (int, float)) and turnover > 0, turnover
          market_status = snapshot.get("market_status")
          assert isinstance(market_status, dict), "market_status must be an object"
          for key in ("fear_greed", "north_flow", "south_flow", "margin_balance"):
              item = market_status.get(key)
              assert isinstance(item, dict), f"market_status.{key} must be an object"
              assert isinstance(item.get("availability"), str) and item["availability"], key
              assert item.get("trade_date") is None or isinstance(item.get("trade_date"), str), key
          print(f"validated path=deploy/live_estimates.json trade_date={today} estimates=25 turnover={turnover:.2f}万亿 market_status=4项")
          PY

      - name: 受控发布唯一快照文件
        if: steps.market.outputs.active == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python publish_live_snapshot.py

      - name: 完成手动应急发布
        if: steps.market.outputs.active == 'true'
        run: echo "实时快照已完成单文件发布与公开 Raw 回读；未触发 Pages 整站部署。"
