name: 更新盘中基金估值

# WorkBuddy 自动化是盘中唯一主时钟；本工作流仅保留手动应急入口，避免并发写入。
on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# 内置令牌提交不会触发另一个 push 工作流，因此实时快照必须在本工作流内直接部署到 Pages。
concurrency:
  group: live-estimates
  cancel-in-progress: false

jobs:
  publish-live-estimates:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install requests

      - name: 判断中国交易时段
        id: market
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo("Asia/Shanghai"))
          minutes = now.hour * 60 + now.minute
          # 仅连续竞价时段执行，避免午休和收盘后写入无效快照。
          active = now.weekday() < 5 and (570 <= minutes <= 690 or 780 <= minutes <= 900)
          print(f"active={'true' if active else 'false'}")
          PY

      - name: 抓取并写入实时估值快照
        if: steps.market.outputs.active == 'true'
        run: python fetch_live_estimates.py

      - name: 校验实时快照完整性
        if: steps.market.outputs.active == 'true'
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from zoneinfo import ZoneInfo

          with open('deploy/live_estimates.json', encoding='utf-8') as f:
              snapshot = json.load(f)
          today = datetime.now(ZoneInfo('Asia/Shanghai')).date().isoformat()
          assert snapshot.get('trade_date') == today, snapshot.get('trade_date')
          assert snapshot.get('estimate_count') == 25, snapshot.get('estimate_count')
          assert len(snapshot.get('estimates', {})) == 25
          turnover = (snapshot.get('sse_index') or {}).get('market_turnover_trillion')
          assert isinstance(turnover, (int, float)), turnover
          print(f"validated trade_date={today} estimates=25 turnover={turnover:.2f}万亿")
          PY

      - name: 提交实时估值快照
        if: steps.market.outputs.active == 'true'
        id: commit
        run: |
          if git diff --quiet -- deploy/live_estimates.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/live_estimates.json
          git commit -m "chore: 更新盘中基金估值"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: 配置 Pages
        if: steps.market.outputs.active == 'true'
        uses: actions/configure-pages@v5

      - name: 上传实时页面工件
        if: steps.market.outputs.active == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

      - name: 部署实时快照到 Pages
        if: steps.market.outputs.active == 'true'
        uses: actions/deploy-pages@v4

