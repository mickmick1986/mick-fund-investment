name: 更新盘中基金估值

# WorkBuddy 自动化是盘中唯一主时钟；本工作流仅保留手动应急入口，避免并发写入。
on:
  workflow_dispatch:

permissions:
  contents: write

# 仅保留手动应急抓取与提交；盘中页面从公开 Raw 实时快照读取，禁止在此触发 Pages 整站部署。
concurrency:
  group: live-estimates
  cancel-in-progress: false

jobs:
  publish-live-estimates:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install requests

      - name: 判断中国交易时段
        id: market
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo("Asia/Shanghai"))
          minutes = now.hour * 60 + now.minute
          # 仅连续竞价时段执行，避免午休和收盘后写入无效快照。
          active = now.weekday() < 5 and (570 <= minutes <= 690 or 780 <= minutes <= 900)
          print(f"active={'true' if active else 'false'}")
          PY

      - name: 抓取并写入实时估值快照
        if: steps.market.outputs.active == 'true'
        run: python fetch_live_estimates.py

      - name: 校验实时快照完整性
        if: steps.market.outputs.active == 'true'
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from zoneinfo import ZoneInfo

          with open('deploy/live_estimates.json', encoding='utf-8') as f:
              snapshot = json.load(f)
          today = datetime.now(ZoneInfo('Asia/Shanghai')).date().isoformat()
          assert snapshot.get('trade_date') == today, snapshot.get('trade_date')
          assert snapshot.get('estimate_count') == 25, snapshot.get('estimate_count')
          assert len(snapshot.get('estimates', {})) == 25
          turnover = (snapshot.get('sse_index') or {}).get('market_turnover_trillion')
          assert isinstance(turnover, (int, float)), turnover
          print(f"validated trade_date={today} estimates=25 turnover={turnover:.2f}万亿")
          PY

      - name: 隔离发布实时估值快照
        if: steps.market.outputs.active == 'true'
        run: python publish_live_snapshot.py

      - name: 完成手动应急发布
        if: steps.market.outputs.active == 'true'
        run: |
          echo "实时快照已完成隔离发布与公开 Raw 回读；无需触发 Pages 整站部署。"

