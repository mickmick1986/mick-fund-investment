name: 更新盘中基金估值

on:
  # GitHub 的定时任务在整5分钟常有延迟或丢调度，改为错峰双通道：北京时间 09:32-11:27、13:02-14:57。
  schedule:
    - cron: '2-57/5 1-3 * * 1-5'
    - cron: '2-57/5 5-6 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

# 快照只需提交到main；Pages由既有分支部署链路更新。
# 不在此工作流重复部署Pages，避免部署耗时与下一轮5分钟任务相互取消。
concurrency:
  group: live-estimates
  cancel-in-progress: false

jobs:
  publish-live-estimates:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install requests

      - name: 判断中国交易时段
        id: market
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo("Asia/Shanghai"))
          minutes = now.hour * 60 + now.minute
          # 与错峰 cron 对齐：09:32 起覆盖早盘，15:00 前保留最后一笔收盘估值。
          active = now.weekday() < 5 and 570 <= minutes <= 900
          print(f"active={'true' if active else 'false'}")
          PY

      - name: 抓取并写入实时估值快照
        if: steps.market.outputs.active == 'true'
        run: python fetch_live_estimates.py

      - name: 提交实时估值快照
        if: steps.market.outputs.active == 'true'
        id: commit
        run: |
          if git diff --quiet -- deploy/live_estimates.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/live_estimates.json
          git commit -m "chore: 更新盘中基金估值"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

