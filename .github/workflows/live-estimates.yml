name: 更新盘中基金估值

on:
  # 显式列出错峰分钟，避免部分调度器对“范围/步长”表达式兼容不稳定。
  # 北京时间：09:32-11:27、13:02-14:57，每5分钟。
  schedule:
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 1-3 * * 1-5'
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 5-6 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# 内置令牌提交不会触发另一个 push 工作流，因此实时快照必须在本工作流内直接部署到 Pages。
concurrency:
  group: live-estimates
  cancel-in-progress: false

jobs:
  publish-live-estimates:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install requests

      - name: 判断中国交易时段
        id: market
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo("Asia/Shanghai"))
          minutes = now.hour * 60 + now.minute
          # 与错峰 cron 对齐：09:32 起覆盖早盘，15:00 前保留最后一笔收盘估值。
          active = now.weekday() < 5 and 570 <= minutes <= 900
          print(f"active={'true' if active else 'false'}")
          PY

      - name: 抓取并写入实时估值快照
        if: steps.market.outputs.active == 'true'
        run: python fetch_live_estimates.py

      - name: 提交实时估值快照
        if: steps.market.outputs.active == 'true'
        id: commit
        run: |
          if git diff --quiet -- deploy/live_estimates.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/live_estimates.json
          git commit -m "chore: 更新盘中基金估值"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: 配置 Pages
        if: steps.market.outputs.active == 'true'
        uses: actions/configure-pages@v5

      - name: 上传实时页面工件
        if: steps.market.outputs.active == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

      - name: 部署实时快照到 Pages
        if: steps.market.outputs.active == 'true'
        uses: actions/deploy-pages@v4

